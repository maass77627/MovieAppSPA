<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body class="body">
    <nav class="nav">
        <h1>Hogwarts House Cup</h1>
        <image src="assets/hogwarts.webp"></image> 
    </nav>

    <div id="navbar" class="navbar">
        <div class="total-students" id="total-students">
        <h1>Totals</h1>
        <p> Houses: <span id="house-count"></span></p>
        <p> Characters: <span id="character-count"></span></p>
        </div>
           <div class="point-leader" id="point-leader">
            <h1>Point Leaders</h1>
            
           </div>
           <div id="timer-div" class="timer-div">
            <h1>Timer</h1>
           <div class="timer" id="timer">
            
           </div>
           </div>
    </div>

    <div class="input-wrap">
    <label>Search Students</label>
    <input  type="text"  id="search" className="search"></input>
    </div>



<main class="main">
    <div class="hogwart-manager">
        <h1 >Hogwart managment system</h1>
         <a href="#characters">Characters</a><br>
  <a href="#houses">Houses</a><br>
  <a href="#standings">House Standings</a>
    </div>
<div id="charContainer">

</div>

<div id="house-standing" class="house-standing">
<h1>House Standing</h1>
<div class="griff" id="griff">
    <img class="house-img" src="assets/Gryffindor-Logo-Vector.svg-.png" alt="Harry Potter">
</div>
<div class="slyth" id="slyth">
    <img class="house-img" src="assets/Slytherin-Logo.png" alt="Harry Potter">
</div>
<div class="rav" id="rav">
    <img class="house-img" src="assets/Ravenclaw-Emblem.png" alt="Harry Potter">
</div>
<div class="huff" id="huff">
    <img g class="house-img" src="assets/hufflepuff.png" alt="Harry Potter">
</div>
</div>


</main>



<div id="spell-book" class="spell-book">

    <div id="spell-container" class="spell-container">

        <div class="heading-wrap"> 
            <h1>Choose A Student </h1>
            <select id="character-select" class="character-select">
               
            </select>
            <h1> Assign A Spell</h1>
        </div> 
        <label>Search for spells</label>
        <input id="spell-search" type="text" class="search">

        <div id="spells" class="spells"></div>

        <button id="spell-button" class="spell-button">
           Add Assignments
        </button>

    </div>


    <div id="book-container" class="book-container">

        <h1>Recent Books</h1>

        <div class="book-wrap" id="book-wrap"></div>

    </div>

</div>
